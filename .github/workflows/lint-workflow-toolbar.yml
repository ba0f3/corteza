name: Lint workflow toolbar patch

on:
  push:
    branches:
      - fix/workflow-toolbar-actions
    paths:
      - .github/workflows/lint-workflow-toolbar.yml

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workflow-toolbar-actions
          fetch-depth: 2

      - name: Fix lint issue
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/web/compose/src/views/Public/Pages/Records/View.vue')
          s = p.read_text(encoding='utf-8')
          old = "          new Error('Invalid record-toolbar workflow action configuration')\n        )"
          new = "          new Error('Invalid record-toolbar workflow action configuration'),\n        )"
          if s.count(old) != 1:
              raise SystemExit(f'expected exact lint marker once, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: client/web/compose/yarn.lock

      - name: Install Yarn 1
        run: npm install --global yarn@1.22.22

      - name: Install Compose dependencies
        working-directory: client/web/compose
        run: yarn install --frozen-lockfile --non-interactive --no-progress

      - name: Lint patched record view
        working-directory: client/web/compose
        run: yarn eslint src/views/Public/Pages/Records/View.vue

      - name: Commit fix and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lint-workflow-toolbar.yml
          git add client/web/compose/src/views/Public/Pages/Records/View.vue
          git commit -m "fix(compose): satisfy workflow toolbar lint"
          git push origin HEAD:fix/workflow-toolbar-actions
