name: Apply workflow toolbar patch

on:
  push:
    branches:
      - fix/workflow-toolbar-actions
    paths:
      - .github/workflows/apply-workflow-toolbar-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workflow-toolbar-actions
          fetch-depth: 2

      - name: Patch native record toolbar workflow actions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = Path('client/web/compose/src/views/Public/Pages/Records/View.vue')
          text = target.read_text(encoding='utf-8')

          def replace_exact(old, new, expected=1, label='marker'):
              global text
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'FAIL {label}: expected {expected}, found {found}')
              text = text.replace(old, new)

          replace_exact(
              "import { compose, system, NoID } from '@cortezaproject/corteza-js'",
              "import { automation, compose, system, NoID } from '@cortezaproject/corteza-js'",
              label='automation import',
          )

          replace_exact(
              '            :variant="action.meta.style.variant"\n            :disabled="processing"',
              '            :variant="action.meta.style.variant"\n            :disabled="processing || isLayoutActionProcessing(action, index)"',
              expected=3,
              label='toolbar action disabled state',
          )

          replace_exact(
              '            :target="generateActionTarget(action)"\n          >',
              '            :target="generateActionTarget(action)"\n            @click="handleLayoutAction(action, index)"\n          >',
              expected=3,
              label='toolbar action click handler',
          )

          replace_exact(
              "      loadingRecord: false,\n\n      // Used to identify, load, and delete the correct draft",
              "      loadingRecord: false,\n\n"
              "      layoutActionVisibility: {},\n"
              "      processingLayoutActions: [],\n\n"
              "      // Used to identify, load, and delete the correct draft",
              label='toolbar action component state',
          )

          replace_exact(
              "    layoutActions () {\n"
              "      const { config = {} } = this.layout || {}\n"
              "      const { actions = [] } = config\n\n"
              "      return actions.filter(({ enabled }) => enabled)\n"
              "    },",
              "    layoutActions () {\n"
              "      const { config = {} } = this.layout || {}\n"
              "      const { actions = [] } = config\n\n"
              "      return actions.filter((action, index) => {\n"
              "        if (!action.enabled) return false\n\n"
              "        const visibility = String(((action.params || {}).visibility) || '').trim()\n"
              "        if (!visibility) return true\n\n"
              "        return this.layoutActionVisibility[this.layoutActionKey(action, index)] === true\n"
              "      })\n"
              "    },",
              label='toolbar action visibility filter',
          )

          replace_exact(
              "          this.determineLayout({ pageLayoutID: currentLayoutID })\n"
              "            .then(blocks => {\n"
              "              if (blocks) {\n"
              "                this.blocks = blocks\n"
              "              }\n"
              "            })",
              "          this.determineLayout({ pageLayoutID: currentLayoutID })\n"
              "            .then(blocks => {\n"
              "              if (blocks) {\n"
              "                this.blocks = blocks\n"
              "              }\n\n"
              "              return this.evaluateLayoutActionExpressions()\n"
              "            })",
              label='layout-switch visibility refresh',
          )

          replace_exact(
              "    evaluateLayoutConditions () {\n"
              "      this.evaluateBlocks()\n"
              "    },",
              "    evaluateLayoutConditions () {\n"
              "      this.evaluateBlocks()\n"
              "      this.evaluateLayoutActionExpressions()\n"
              "    },",
              label='record-field visibility refresh',
          )

          replace_exact(
              "          this.record = this.tempRecord\n"
              "          this.initialRecordState = this.record.clone()\n\n"
              "          this.getRecordDraft()",
              "          this.record = this.tempRecord\n"
              "          this.initialRecordState = this.record.clone()\n\n"
              "          return this.evaluateLayoutActionExpressions().then(() => {\n"
              "            this.getRecordDraft()\n"
              "          })",
              label='record-load visibility refresh',
          )

          methods = r'''    layoutActionKey (action, index) {
            const actionID = String((action || {}).actionID || '')
            return actionID && actionID !== NoID ? actionID : String(index)
          },

          isLayoutActionProcessing (action, index) {
            return this.processingLayoutActions.includes(this.layoutActionKey(action, index))
          },

          async evaluateLayoutActionExpressions () {
            const actions = (((this.layout || {}).config || {}).actions || [])
            const expressions = {}

            actions.forEach((action, index) => {
              if (!action.enabled) return

              const visibility = String(((action.params || {}).visibility) || '').trim()
              if (!visibility) return

              expressions[this.layoutActionKey(action, index)] = visibility
            })

            if (Object.keys(expressions).length === 0) {
              this.layoutActionVisibility = {}
              return
            }

            try {
              this.layoutActionVisibility = await this.$SystemAPI.expressionEvaluate({
                variables: this.expressionVariables(),
                expressions,
              }) || {}
            } catch (e) {
              this.layoutActionVisibility = Object.keys(expressions).reduce((out, key) => {
                out[key] = false
                return out
              }, {})
              this.toastErrorHandler(this.$t('notification:evaluate.failed'))(e)
            }
          },

          async handleLayoutAction (action, index) {
            if (!action || action.kind !== 'workflow') return

            const params = action.params || {}
            const workflowID = String(params.workflowID || '')
            const stepID = String(params.stepID || '')
            const resourceType = params.resourceType || 'compose:record'

            if (!workflowID || !stepID || resourceType !== 'compose:record' || !this.record || !this.module) {
              this.toastErrorHandler(this.$t('notification:automation.scriptFailed'))(
                new Error('Invalid record-toolbar workflow action configuration')
              )
              return
            }

            const key = this.layoutActionKey(action, index)
            if (this.processingLayoutActions.includes(key)) return

            this.processingLayoutActions.push(key)

            try {
              let ev = {
                args: {
                  namespace: this.namespace,
                  module: this.module,
                },
              }
              ev = compose.RecordEvent(this.record, ev)

              await this.$AutomationAPI.workflowExec({
                workflowID,
                stepID,
                input: automation.Encode(ev.args),
              })

              // Workflow/backend owns business state. Reload the authoritative
              // record so the toolbar immediately reflects the new state.
              await this.refresh()
            } catch (e) {
              this.toastErrorHandler(this.$t('notification:automation.scriptFailed'))(e)
            } finally {
              this.processingLayoutActions = this.processingLayoutActions.filter(k => k !== key)
            }
          },

          '''
          replace_exact(
              "    generateActionLink (action) {",
              methods + "    generateActionLink (action) {",
              label='workflow toolbar methods',
          )

          replace_exact(
              "      this.abortableRequests = []\n"
              "      this.loadingRecord = false\n"
              "    },",
              "      this.abortableRequests = []\n"
              "      this.loadingRecord = false\n"
              "      this.layoutActionVisibility = {}\n"
              "      this.processingLayoutActions = []\n"
              "    },",
              label='toolbar state cleanup',
          )

          target.write_text(text, encoding='utf-8')
          print(f'patched {target}')
          PY

          git diff --check
          grep -q "async handleLayoutAction" client/web/compose/src/views/Public/Pages/Records/View.vue
          grep -q "automation.Encode" client/web/compose/src/views/Public/Pages/Records/View.vue
          grep -q "layoutActionVisibility" client/web/compose/src/views/Public/Pages/Records/View.vue

      - name: Commit patch and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-workflow-toolbar-patch.yml
          git add client/web/compose/src/views/Public/Pages/Records/View.vue
          git commit -m "feat(compose): support workflow actions in record toolbar"
          git push origin HEAD:fix/workflow-toolbar-actions
